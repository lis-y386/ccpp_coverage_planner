<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="350" viewBox="0 0 1160 350"><g font-family="Arial, sans-serif"><rect width="1160" height="350" fill="#f5f7f3"/><rect x="25" y="85" width="220" height="100" rx="10" fill="#e3eee7" stroke="#94b6aa"/><text x="40" y="120" fill="#203a47" font-size="18">Map + odometry</text><text x="40" y="150" fill="#607981" font-size="13">Obstacle cloud / TF</text><rect x="300" y="85" width="260" height="100" rx="10" fill="#e3eee7" stroke="#94b6aa"/><text x="315" y="120" fill="#203a47" font-size="18">ROS adapter</text><text x="315" y="150" fill="#607981" font-size="13">Occupancy / confirmed state</text><rect x="615" y="85" width="220" height="100" rx="10" fill="#e3eee7" stroke="#94b6aa"/><text x="630" y="120" fill="#203a47" font-size="18">C++ core</text><text x="630" y="150" fill="#607981" font-size="13">Lattice sweep + A*</text><rect x="890" y="85" width="245" height="100" rx="10" fill="#e3eee7" stroke="#94b6aa"/><text x="905" y="120" fill="#203a47" font-size="18">External executor</text><text x="905" y="150" fill="#607981" font-size="13">Actual motion / arrival</text><g stroke="#177f7b" stroke-width="2" fill="none"><path d="M245 135H300 M560 135H615 M835 135H890"/><path d="M1010 185V260H430V185"/></g><text x="560" y="248" fill="#177f7b" font-size="15">Actual reached_point acknowledgment</text><text x="25" y="36" fill="#203a47" font-size="22">Planning is separate from physical execution.</text><text x="25" y="326" fill="#607981" font-size="13">Standalone mode calls the same C++ core directly; no ROS or flight stack is required.</text></g></svg>
